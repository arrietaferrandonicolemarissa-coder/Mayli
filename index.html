<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Quinceañera Invitation</title>\n    <style>\n        body { font-family: Arial, sans-serif; text-align: center; }\n        #countdown { font-size: 2em; margin: 20px; }\n    </style>\n    <script>\n        function startCountdown() {\n            const countdownDate = new Date('2026-04-02T22:24:32Z').getTime();\n            const timer = setInterval(() => {\n                const now = new Date().getTime();\n                const distance = countdownDate - now;\n                const days = Math.floor(distance / (1000 * 60 * 60 * 24));\n                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));\n                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));\n                const seconds = Math.floor((distance % (1000 * 60)) / 1000);\n                document.getElementById('countdown').innerHTML = days + 'd ' + hours + 'h ' + minutes + 'm ' + seconds + 's ';\n                if (distance < 0) {\n                    clearInterval(timer);\n                    document.getElementById('countdown').innerHTML = 'EXPIRED';\n                }\n            }, 1000);\n        }\n    </script>\n</head>\n<body onload="startCountdown()">\n    <h1>You are invited to the Quinceañera!</h1>\n    <img src="mayli.jpg" alt="Quinceañera Invitation" style="width:300px;height:auto;">\n    <div id="countdown"></div>\n    <h2>Event Location:</h2>\n    <p>123 Fiesta Lane, Celebration City</p>\n    <a href="https://wa.me/?text=I%20will%20attend%20the%20Quinceañera!" target="_blank">\n        <button>Confirm on WhatsApp</button>\n    </a>\n</body>\n</html>
