<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Mayli's Quinceañera Invitation</title>\n    <style>\n        body { font-family: Arial, sans-serif; text-align: center; }\n        #countdown { font-size: 2em; }\n    </style>\n</head>\n<body>\n    <h1>You're Invited to Mayli's XV Años Celebration!</h1>\n    <p>Join us on April 18, 2026 at 22:00</p>\n    <p>Location: Av. Las Américas Mz C Lote 6 Moche</p>\n    <div id="countdown"></div>\n    <button onclick="window.open('https://wa.me/51970015564', '_blank')">Confirm Attendance via WhatsApp</button>\n    <img src="mayli.jpg" alt="Mayli's Image">\n    <script>\n        const eventDate = new Date("2026-04-18T22:00:00").getTime();\n        const countdownTimer = setInterval(function() {\n            const now = new Date().getTime();\n            const distance = eventDate - now;\n            const days = Math.floor(distance / (1000 \* 60 \* 60 \* 24));\n            const hours = Math.floor((distance % (1000 \* 60 \* 60 \* 24)) / (1000 \* 60 \* 60));\n            const minutes = Math.floor((distance % (1000 \* 60 \* 60)) / (1000 \* 60));\n            const seconds = Math.floor((distance % (1000 \* 60)) / 1000);\n            document.getElementById("countdown").innerHTML = days + "d " + hours + "h " + minutes + "m " + seconds + "s ";\n            if (distance < 0) {\n                clearInterval(countdownTimer);\n                document.getElementById("countdown").innerHTML = "The event has started!";\n            }\n        }, 1000);\n    <\/script>\n</body>\n</html>
